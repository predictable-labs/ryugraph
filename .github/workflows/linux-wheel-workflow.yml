name: Build Linux Wheels

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      isNightly:
        type: boolean
        required: true
        default: false

jobs:
  build-linux-wheels-x86_64:
    runs-on: [self-hosted, ubuntu22]
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          yum install -y cmake gcc gcc-c++ patchelf
          /opt/python/cp310-cp310/bin/pip install -U pip setuptools wheel auditwheel "packaging>=24.2"

      - name: Update nightly version
        if: ${{ inputs.isNightly == true }}
        run: |
          /opt/python/cp310-cp310/bin/pip install "packaging>=24.2"
          /opt/python/cp310-cp310/bin/python update-nightly-build-version.py
        working-directory: scripts

      - name: Create source distribution
        working-directory: ./scripts/pip-package/
        run: |
          /opt/python/cp310-cp310/bin/python package_tar.py ryugraph.tar.gz

      - name: Build wheels
        working-directory: ./scripts/pip-package/
        run: |
          mkdir -p wheelhouse

          # Build wheels for multiple Python versions
          for PYBIN in /opt/python/cp3{8,9,10,11,12}*/bin; do
            if [ -d "$PYBIN" ]; then
              echo "Building wheel with $PYBIN/python"
              "${PYBIN}/pip" install -U pip setuptools wheel "packaging>=24.2"
              "${PYBIN}/pip" wheel ryugraph.tar.gz --no-deps -w wheelhouse/
            fi
          done

          # Repair wheels to make them manylinux_2_28 compatible
          for whl in wheelhouse/*.whl; do
            if [[ -f "$whl" && ! "$whl" =~ manylinux ]]; then
              echo "Repairing $whl"
              auditwheel repair "$whl" --plat manylinux_2_28_x86_64 -w wheelhouse/
              rm "$whl"
            fi
          done

      - name: List built wheels
        run: ls -la ./scripts/pip-package/wheelhouse/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-wheels-x86_64
          path: ./scripts/pip-package/wheelhouse/*.whl

  build-linux-wheels-aarch64:
    # Build manylinux_2_28 wheels for ARM64
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    container:
      image: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          yum install -y cmake gcc gcc-c++ patchelf
          /opt/python/cp310-cp310/bin/pip install -U pip setuptools wheel auditwheel "packaging>=24.2"

      - name: Update nightly version
        if: ${{ inputs.isNightly == true }}
        run: |
          /opt/python/cp310-cp310/bin/pip install "packaging>=24.2"
          /opt/python/cp310-cp310/bin/python update-nightly-build-version.py
        working-directory: scripts

      - name: Create source distribution
        working-directory: ./scripts/pip-package/
        run: |
          /opt/python/cp310-cp310/bin/python package_tar.py ryugraph.tar.gz

      - name: Build wheels
        working-directory: ./scripts/pip-package/
        run: |
          mkdir -p wheelhouse

          # Build wheels for multiple Python versions
          for PYBIN in /opt/python/cp3{8,9,10,11,12}*/bin; do
            if [ -d "$PYBIN" ]; then
              echo "Building wheel with $PYBIN/python"
              "${PYBIN}/pip" install -U pip setuptools wheel "packaging>=24.2"
              "${PYBIN}/pip" wheel ryugraph.tar.gz --no-deps -w wheelhouse/
            fi
          done

          # Repair wheels to make them manylinux_2_28 compatible
          for whl in wheelhouse/*.whl; do
            if [[ -f "$whl" && ! "$whl" =~ manylinux ]]; then
              echo "Repairing $whl"
              auditwheel repair "$whl" --plat manylinux_2_28_aarch64 -w wheelhouse/
              rm "$whl"
            fi
          done

      - name: List built wheels
        run: ls -la ./scripts/pip-package/wheelhouse/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-wheels-aarch64
          path: ./scripts/pip-package/wheelhouse/*.whl
