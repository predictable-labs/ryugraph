name: Build Linux Wheels

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      isNightly:
        type: boolean
        required: true
        default: false

jobs:
  build-linux-wheels-x86_64:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Pull manylinux image
        run: docker pull quay.io/pypa/manylinux_2_28_x86_64

      - name: Build wheels in manylinux container
        run: |
          docker run --rm -e RUNNER_UID=$(id -u) -e RUNNER_GID=$(id -g) -v $(pwd):/workspace -w /workspace \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash -c '
              set -e
              # Install build dependencies
              yum install -y git cmake gcc gcc-c++ patchelf
              git config --global --add safe.directory /workspace

              # Install Python packages
              /opt/python/cp310-cp310/bin/pip install -U pip setuptools wheel auditwheel "packaging>=24.2"

              # Update nightly version if needed
              if [ "${{ inputs.isNightly }}" = "true" ]; then
                /opt/python/cp310-cp310/bin/pip install "packaging>=24.2"
                cd scripts
                /opt/python/cp310-cp310/bin/python update-nightly-build-version.py
                cd ..
              fi

              # Create source distribution
              cd scripts/pip-package
              /opt/python/cp310-cp310/bin/python package_tar.py ryugraph.tar.gz

              # Build wheels for multiple Python versions
              mkdir -p wheelhouse
              for PYBIN in /opt/python/cp3{8,9,10,11,12}*/bin; do
                if [ -d "$PYBIN" ]; then
                  echo "Building wheel with $PYBIN/python"
                  "${PYBIN}/pip" install -U pip setuptools wheel "packaging>=24.2"
                  "${PYBIN}/pip" wheel ryugraph.tar.gz --no-deps -w wheelhouse/
                fi
              done

              # Repair wheels to make them manylinux_2_28 compatible
              for whl in wheelhouse/*.whl; do
                if [[ -f "$whl" && ! "$whl" =~ manylinux ]]; then
                  echo "Repairing $whl"
                  auditwheel repair "$whl" --plat manylinux_2_28_x86_64 -w wheelhouse/
                  rm "$whl"
                fi
              done

              # Fix ownership of generated files
              chown -R $RUNNER_UID:$RUNNER_GID /workspace/scripts/pip-package/wheelhouse /workspace/scripts/pip-package/*.tar.gz /workspace/scripts/pip-package/ryugraph.egg-info 2>/dev/null || true
            '

      - name: List built wheels
        run: ls -la ./scripts/pip-package/wheelhouse/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-wheels-x86_64
          path: ./scripts/pip-package/wheelhouse/*.whl

  build-linux-wheels-aarch64:
    # Build manylinux_2_28 wheels for ARM64
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v4

      - name: Pull manylinux image
        run: docker pull quay.io/pypa/manylinux_2_28_aarch64

      - name: Build wheels in manylinux container
        run: |
          docker run --rm -e RUNNER_UID=$(id -u) -e RUNNER_GID=$(id -g) -v $(pwd):/workspace -w /workspace \
            quay.io/pypa/manylinux_2_28_aarch64 \
            bash -c '
              set -e
              # Install build dependencies
              yum install -y git cmake gcc gcc-c++ patchelf
              git config --global --add safe.directory /workspace

              # Install Python packages
              /opt/python/cp310-cp310/bin/pip install -U pip setuptools wheel auditwheel "packaging>=24.2"

              # Update nightly version if needed
              if [ "${{ inputs.isNightly }}" = "true" ]; then
                /opt/python/cp310-cp310/bin/pip install "packaging>=24.2"
                cd scripts
                /opt/python/cp310-cp310/bin/python update-nightly-build-version.py
                cd ..
              fi

              # Create source distribution
              cd scripts/pip-package
              /opt/python/cp310-cp310/bin/python package_tar.py ryugraph.tar.gz

              # Build wheels for multiple Python versions
              mkdir -p wheelhouse
              for PYBIN in /opt/python/cp3{8,9,10,11,12}*/bin; do
                if [ -d "$PYBIN" ]; then
                  echo "Building wheel with $PYBIN/python"
                  "${PYBIN}/pip" install -U pip setuptools wheel "packaging>=24.2"
                  "${PYBIN}/pip" wheel ryugraph.tar.gz --no-deps -w wheelhouse/
                fi
              done

              # Repair wheels to make them manylinux_2_28 compatible
              for whl in wheelhouse/*.whl; do
                if [[ -f "$whl" && ! "$whl" =~ manylinux ]]; then
                  echo "Repairing $whl"
                  auditwheel repair "$whl" --plat manylinux_2_28_aarch64 -w wheelhouse/
                  rm "$whl"
                fi
              done

              # Fix ownership of generated files
              chown -R $RUNNER_UID:$RUNNER_GID /workspace/scripts/pip-package/wheelhouse /workspace/scripts/pip-package/*.tar.gz /workspace/scripts/pip-package/ryugraph.egg-info 2>/dev/null || true
            '

      - name: List built wheels
        run: ls -la ./scripts/pip-package/wheelhouse/

      - uses: actions/upload-artifact@v4
