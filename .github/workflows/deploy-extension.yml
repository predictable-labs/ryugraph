name: Deploy Extensions

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID to download artifacts from (leave empty to use current run)'
        required: false
        type: string
      deploy_python:
        description: 'Deploy Python packages'
        type: boolean
        required: false
        default: false
      deploy_nodejs:
        description: 'Deploy Node.js packages'
        type: boolean
        required: false
        default: false
      deploy_wasm:
        description: 'Deploy WASM packages'
        type: boolean
        required: false
        default: false
      deploy_rust:
        description: 'Deploy Rust crate'
        type: boolean
        required: false
        default: false
      deploy_extensions:
        description: 'Deploy Extensions'
        type: boolean
        required: false
        default: true
  workflow_call:

jobs:
  deploy-extensions:
    if: ${{ inputs.deploy_extensions == true }}
    runs-on: self-hosted
    permissions:
      packages: write
    steps:
      - name: Free disk space on Ubuntu runner
        uses: kfir4444/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      
      - uses: actions/checkout@v4

      - name: Restructure directories
        run: |
          mv scripts/extension ../extension-scripts
          rm -rf *
          mv ../extension-scripts/* .

      - name: Download artifacts from previous run
        if: ${{ inputs.run_id != '' }}
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-and-deploy-extension.yml
          run_id: ${{ inputs.run_id }}
          name: ryugraph-extensions
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts from current run
        if: ${{ inputs.run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: ryugraph-extensions

      - name: Ensure dataset directory exists
        run: |
          mkdir -p dataset
          if [ ! "$(ls -A dataset)" ]; then
            echo "Dataset directory is empty, creating placeholder"
            echo "# Dataset placeholder" > dataset/README.md
          fi

      - name: Debug - List files
        run: |
          echo "Current directory:"
          pwd
          echo "Files in current directory:"
          ls -la
          echo "Checking for Dockerfile:"
          test -f Dockerfile && echo "Dockerfile exists" || echo "Dockerfile NOT found"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/predictable-labs/extension-repo:latest

  deploy-python:
    if: ${{ inputs.deploy_python == true }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download ryu-deploy-wheels artifact (old name)
        if: ${{ inputs.run_id != '' }}
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-and-deploy.yml
          run_id: ${{ inputs.run_id }}
          name: ryu-deploy-wheels
          path: dist
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download ryugraph-deploy-wheels artifact (new name)
        if: ${{ inputs.run_id != '' }}
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-and-deploy.yml
          run_id: ${{ inputs.run_id }}
          name: ryugraph-deploy-wheels
          path: dist
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts from current run
        if: ${{ inputs.run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: '*-wheels-*'
          path: dist
          merge-multiple: true

      - name: Download sdist from current run
        if: ${{ inputs.run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: python-sdist
          path: dist

      - name: List wheels
        run: |
          echo "Contents of dist/:"
          ls -laR dist/

      - name: Deploy to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  deploy-nodejs:
    if: ${{ inputs.deploy_nodejs == true }}
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_JS_TOKEN }}
    steps:
      - name: Download nodejs artifact (old name)
        if: ${{ inputs.run_id != '' }}
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-and-deploy.yml
          run_id: ${{ inputs.run_id }}
          name: ryu-deploy-nodejs
          path: tools/nodejs_api
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download nodejs artifact (new name)
        if: ${{ inputs.run_id != '' }}
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-and-deploy.yml
          run_id: ${{ inputs.run_id }}
          name: ryugraph-deploy-nodejs
          path: tools/nodejs_api
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts from current run
        if: ${{ inputs.run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: ryugraph-deploy-nodejs
          path: tools/nodejs_api

      - uses: actions/setup-node@v3
        with:
          node-version: "16"
          registry-url: "https://registry.npmjs.org"

      - name: Deploy to npm.js
        run: npm publish ryugraph-source.tar.gz --access public --tag latest
        working-directory: tools/nodejs_api

  deploy-wasm:
    if: ${{ inputs.deploy_wasm == true }}
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_JS_TOKEN }}
    steps:
      - name: Download wasm artifact (old name)
        if: ${{ inputs.run_id != '' }}
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-and-deploy.yml
          run_id: ${{ inputs.run_id }}
          name: ryu-deploy-wasm
          path: tools/wasm
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download wasm artifact (new name)
        if: ${{ inputs.run_id != '' }}
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-and-deploy.yml
          run_id: ${{ inputs.run_id }}
          name: ryugraph-deploy-wasm
          path: tools/wasm
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts from current run
        if: ${{ inputs.run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: ryugraph-deploy-wasm
          path: tools/wasm

      - uses: actions/setup-node@v3
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Deploy to npm.js
        run: npm publish ryugraph-wasm.tar.gz --access public --tag latest
        working-directory: tools/wasm

  deploy-rust:
    if: ${{ inputs.deploy_rust == true }}
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Update Cargo.toml version
        run: python3 update_version.py
        working-directory: tools/rust_api

      - name: Deploy crate to Crates.io
        run: cargo publish --allow-dirty
        working-directory: tools/rust_api
